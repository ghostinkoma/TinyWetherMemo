; ============================================================================
;  WetherLoggerBox  -  ESP32-C3 簡易百葉箱ロガー
;  温度/湿度/気圧 + 雷(AS3935→CH32V003 ThunderSenseブリッジ, I2Cスレーブ0x28)
;
;  第1段: 雷センサ実装 (lightning.*) + 危険度(積和)算出
;  今後  : env sensor (温湿度気圧) / Web UI 3タブ / FS記録 / MySQL送信 / 校正UI
; ============================================================================
[platformio]
default_envs = esp32c3

[env:esp32c3]
; ★pioarduino (arduino-esp32 コア3.x)。公式 espressif32 はコア2.x停滞で、C3の
;   USB-Serial-JTAG(HWCDC)に出力ドロップ/ClearCommError ループのバグがある。
;   コア3.xで解消 → シリアル監視が安定。AquaController と同一プラットフォームで統一。
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board     = esp32-c3-devkitm-1
framework = arduino

; USB-Serial-JTAG(HWCDC) を Serial に載せる (COM に log 出力/コマンド受け)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_build.filesystem = littlefs         ; 実データのトレース記録 (datalog)
board_build.partitions  = partitions.csv  ; 単一app+大容量FS(>=2MB)。ビルド実測でapp枠算定
board_upload.flash_size = 4MB
board_build.flash_size  = 4MB

; ThunderSense ホストライブラリは lib/ThunderSense に同梱 (PIOが自動ビルド)
; 環境センサ用ライブラリ。config.h で有効化したセンサ分だけ実際にビルドされる
; (無効センサのラッパ.cpp は #ifdef で空 → LDF がそのライブラリを除外)。
lib_deps =
    adafruit/Adafruit AHTX0
    adafruit/Adafruit BMP280 Library
    adafruit/Adafruit BME280 Library
    adafruit/Adafruit BME680 Library
    adafruit/Adafruit SHT31 Library
    adafruit/DHT sensor library
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    ; OLED (オプション: config.h で WLB_OLED 有効時のみビルドされる)
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit SH110X
