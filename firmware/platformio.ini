; ThunderSense firmware - PlatformIO (Community-PIO-CH32V platform)
;
; Board = genericCH32V003J4M6 (our SOP-8 target). ch32fun is used as the
; "framework" via manual inclusion (this platform has no ch32fun framework).
;
; SETUP (one-time): make ch32fun's source visible as ./ch32fun :
;   Windows (admin) : mklink /D ch32fun D:\hobby\AquaWithWaterboader\work\ch32fun\ch32fun
;   or POSIX        : ln -s /path/to/ch32fun/ch32fun ch32fun
;   or simply copy that folder here as ./ch32fun
; gen_ldscript.py expects ./ch32fun/ch32fun.ld to exist.
;
; Build:   pio run
; Upload:  pio run -t upload      (WCH-LinkE)
;
; Verified 2026-09: RAM 45.1% (924 B), Flash 48.3% (7912 B).

[platformio]
src_dir = .
include_dir = .

[env:genericCH32V003J4M6]
platform = ch32v
board = genericCH32V003J4M6
monitor_speed = 115200
monitor_port = COM9
upload_port = COM9
build_flags = -flto -Ich32fun -I. -lgcc -DFUNCONF_USE_DEBUGPRINTF=1
build_src_filter = +<*.c> +<ch32fun/ch32fun.c>
extra_scripts = pre:gen_ldscript.py
